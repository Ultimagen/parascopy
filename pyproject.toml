[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parascopy"
dynamic = ["version"]
authors = [
    {name = "Timofey Prodanov"},
    {name = "Vikas Bansal"},
]
description = "Robust and accurate estimation of paralog-specific copy number for duplicated genes using WGS"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "biopython>=1.80",
    "construct>=2.10",
    "intervaltree>=3.1.0",
    "numpy>=1.20.0",
    "parasail>=1.3.0",
    "pysam>=0.20.0",
    "scipy>=1.8.0",
    "tqdm>=4.60.0",
]

[project.urls]
Homepage = "https://github.com/tprodanov/parascopy"
Repository = "https://github.com/tprodanov/parascopy"
Issues = "https://github.com/tprodanov/parascopy/issues"

[project.scripts]
parascopy = "parascopy.entry_point:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
parascopy = ["data/depth_regions/*.bed.gz"]

[tool.setuptools.dynamic]
version = {attr = "parascopy.__version__"}
